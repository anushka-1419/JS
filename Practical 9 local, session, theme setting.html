
<!DOCTYPE html>
<html>
<head>
<title>Practical 9 - Theme Storage</title>
<!--
AIM:
To implement Local Storage and Session Storage in JavaScript
to save user preferences such as theme settings.

THEORY:
Local Storage stores data permanently in the browser until
it is manually cleared. Session Storage stores data only
for the current browser tab session.
Both store data as key-value pairs.

CODE EXPLANATION:
1. The user selects Light Mode or Dark Mode.
2. Local Storage saves the selected theme permanently.
3. Session Storage saves a temporary theme preference.
4. On page load, the saved local theme is applied.
5. The Clear button removes saved preferences.

FUNCTIONS AND METHODS USED:
localStorage.setItem() : Saves data in local storage.
localStorage.getItem() : Retrieves saved local data.
localStorage.removeItem() : Removes local storage data.
sessionStorage.setItem() : Saves session data.
sessionStorage.getItem() : Retrieves session data.
sessionStorage.removeItem() : Removes session data.
getElementById() : Accesses an HTML element.
addEventListener() : Handles user events.

CONCLUSION:
Successfully implemented Local Storage and Session Storage
to save and manage user theme preferences.
-->
</head>
<body>
<h2>Theme Preference Settings</h2>
<button onclick="setTheme('light')">Light Mode</button>
<button onclick="setTheme('dark')">Dark Mode</button>
<button onclick="setSessionTheme()">Temporary Dark Mode</button>
<button onclick="clearTheme()">Clear Preferences</button>
<p id="message">Choose your preferred theme.</p>
<script>
function applyTheme(theme) {
    document.body.style.backgroundColor =
        theme === "dark" ? "#222" : "white";
    document.body.style.color =
        theme === "dark" ? "white" : "black";
}
function setTheme(theme) {
    localStorage.setItem("theme", theme);
    sessionStorage.removeItem("theme");
    applyTheme(theme);
    document.getElementById("message").textContent =
        "Theme saved in Local Storage: " + theme;
}
function setSessionTheme() {
    sessionStorage.setItem("theme", "dark");
    applyTheme("dark");
    document.getElementById("message").textContent =
        "Dark theme saved for this session only.";
}
function clearTheme() {
    localStorage.removeItem("theme");
    sessionStorage.removeItem("theme");
    applyTheme("light");
    document.getElementById("message").textContent =
        "All saved preferences cleared.";
}
let savedTheme = sessionStorage.getItem("theme") ||
                 localStorage.getItem("theme") || "light";
applyTheme(savedTheme);
</script>
</body>
</html>
